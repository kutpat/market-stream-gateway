[package]
name = "market-stream-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Provider-neutral cryptocurrency market stream gateway"
license = "UNLICENSED"
publish = false
# Without this, the healthcheck binary makes `cargo run` ambiguous and every
# documented run command fails before it starts.
default-run = "market-stream-gateway"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
flate2 = "1.1"
http = "1.3"
prometheus-client = "0.24"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust_decimal = "1.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1.4"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
