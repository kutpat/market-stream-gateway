name: ci

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          rustc --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  container:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --tag market-stream-gateway:test .
      - name: Smoke test hardened image
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            --env MSG_PROVIDERS=none \
            market-stream-gateway:test)
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null || true' EXIT

          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
          test "$(docker exec "$container_id" id -u)" = "10001"
          if docker exec "$container_id" sh -c 'touch /rootfs-write-test' 2>/dev/null; then
            echo "container root filesystem is writable" >&2
            exit 1
          fi
          docker exec "$container_id" sh -c 'touch /tmp/tmpfs-write-test'

          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1
