name: ci

# Pushes never deploy. Merging to main validates the change and publishes an
# immutable image tagged with the commit SHA; publishing a GitHub Release then
# deploys that already-tested image (see release.yml).
#
# `push` is restricted to main on purpose. Listening on every branch ran the
# whole suite twice for each pull-request push, once per event.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/kutpat/market-stream-gateway

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          rustc --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

  container:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build --tag market-stream-gateway:test .
      - name: Smoke test hardened image
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            --env MSG_PROVIDERS=none \
            market-stream-gateway:test)
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null || true' EXIT

          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
          test "$(docker exec "$container_id" id -u)" = "10001"
          if docker exec "$container_id" sh -c 'touch /rootfs-write-test' 2>/dev/null; then
            echo "container root filesystem is writable" >&2
            exit 1
          fi
          docker exec "$container_id" sh -c 'touch /tmp/tmpfs-write-test'

          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      # Only a push to main publishes. A pull request, including one from a
      # fork, never reaches this step and never needs registry write access.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release.yml resolves a release tag to its commit and looks the image up
      # by full SHA, so that tag is the contract between the two workflows. The
      # image pushed here is the one smoke tested above, retagged rather than
      # rebuilt.
      - name: Push image
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          docker tag market-stream-gateway:test "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag market-stream-gateway:test "$IMAGE_NAME:main"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker push "$IMAGE_NAME:main"
          echo "published $IMAGE_NAME:sha-$GITHUB_SHA"
